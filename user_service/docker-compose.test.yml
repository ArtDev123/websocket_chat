name: user_service_test

services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_test
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
    ports:
      - "5436:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_test"]
      interval: 3s
      timeout: 3s
      retries: 10
