services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
    ports:
      - "5435:5432"
    volumes:
      - user_pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U user_user -d user_db"]
      interval: 3s
      timeout: 3s
      retries: 10
    networks:
      - backend

  user-api:
    build: .
    ports:
      - "8081:8081"
    environment:
      POSTGRES_DB: user_db
      POSTGRES_USER: user_user
      POSTGRES_PASSWORD: user_pass
      POSTGRES_HOST: db
      POSTGRES_PORT: 5432
      APP_HOST: 0.0.0.0
      APP_PORT: 8081
      JWT_SECRET: lesson-secret-key-at-least-32b
      JWT_EXPIRE_MINUTES: 1440
      RABBITMQ_URL: amqp://guest:guest@rabbitmq:5672/
      CORS_ORIGINS: http://127.0.0.1:8082,http://localhost:8082
    depends_on:
      db:
        condition: service_healthy
    networks:
      - backend
      - lesson-net

networks:
  backend:
  lesson-net:
    external: true
    name: lesson-net

volumes:
  user_pgdata:
